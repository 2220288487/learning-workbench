<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研备考工作台</title>
<style>
:root{
  --bg:#f5f7f9; --card:#ffffff; --line:#e8ecf1; --line2:#f1f4f7;
  --txt:#1f2933; --txt2:#6b7684; --txt3:#9aa4b0;
  --pri:#3d7f9a; --pri-soft:#e8f2f6;
  --ok:#4d9d7c; --ok-soft:#e7f4ee;
  --warn:#d99a4e; --warn-soft:#fbf1e3;
  --danger:#d9695f; --danger-soft:#fbeceb;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d8dee6;border-radius:8px}

/* ---------- 布局 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,247,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-size:16px;font-weight:700;letter-spacing:.5px}
.logo span{color:var(--pri)}
.topbar .spacer{flex:1}
.tb-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;color:var(--txt2);font-size:13px;transition:.15s}
.tb-btn:hover{border-color:#cfd8e2;color:var(--txt)}
.tb-btn.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

.nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.nav button{padding:10px 12px;color:var(--txt2);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}

.page{display:none;padding-top:18px}
.page.on{display:block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h3{font-size:15px;font-weight:600}
.card-h .spacer{flex:1}
.card-h .sub{font-size:12px;color:var(--txt3);font-weight:400}
.muted{color:var(--txt2)}
.tiny{font-size:12px}
.empty{padding:26px 10px;text-align:center;color:var(--txt3);font-size:13px;border:1px dashed var(--line);border-radius:10px}
.syncbar{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 11px;margin-bottom:12px;font-size:12.5px;flex-wrap:wrap}
.syncbar .dot{margin-right:0}
.sync-msg{font-size:12.5px;border-radius:9px;padding:9px 11px;margin-top:10px;background:#f1f4f7;color:var(--txt2);word-break:break-all}
.sync-msg.ok{background:var(--ok-soft);color:#2f7a5a}
.sync-msg.err{background:var(--danger-soft);color:var(--danger)}
.tip{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border-radius:9px;padding:8px 11px;margin-bottom:10px;font-size:12.5px;color:#9a6a2c}
.tip .btn{margin-left:auto}

.btn{background:var(--pri);color:#fff;border-radius:9px;padding:7px 13px;font-size:13px;transition:.15s}
.btn:hover{background:#356f88}
.btn.ghost{background:#fff;color:var(--txt2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#cfd8e2;color:var(--txt)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{background:var(--danger)}
.link-btn{color:var(--txt3);font-size:12px;padding:2px 4px}
.link-btn:hover{color:var(--txt)}
.link-btn.d:hover{color:var(--danger)}

.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;background:#f1f4f7;color:var(--txt2)}
.tag.p1{background:var(--danger-soft);color:var(--danger)}
.tag.p2{background:var(--warn-soft);color:var(--warn)}
.tag.p3{background:#f1f4f7;color:var(--txt2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.pri{background:var(--pri-soft);color:var(--pri)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}

/* ---------- 首页：倒计时 ---------- */
.hero{background:linear-gradient(135deg,#ffffff 0%,#f2f8fa 100%);border:1px solid var(--line)}
.hero-top{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.cd-num{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px;color:var(--pri)}
.cd-lab{font-size:12px;color:var(--txt2);margin-top:4px}
.hero-meta{display:flex;gap:22px;flex-wrap:wrap}
.hero-meta .k{font-size:11px;color:var(--txt3)}
.hero-meta .v{font-size:15px;font-weight:600}
.bar{height:6px;background:#eef1f5;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px;transition:width .4s}

/* ---------- 番茄钟 ---------- */
.pomo{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pomo-ring{position:relative;width:150px;height:150px;flex:none}
.pomo-ring svg{transform:rotate(-90deg)}
.pomo-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-time{font-size:30px;font-weight:700;letter-spacing:1px}
.pomo-mode{font-size:11px;color:var(--txt3);margin-top:2px}
.pomo-ctrl{flex:1;min-width:220px}
.pomo-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pomo-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--txt2)}
.pomo-stats b{font-size:16px;color:var(--txt);display:block;font-weight:700}
.pomo-log{margin-top:10px;font-size:12px;color:var(--txt3);max-height:52px;overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:4px 10px;font-size:12px;color:var(--txt2)}
.seg button.on{background:var(--pri-soft);color:var(--pri);font-weight:600}

/* ---------- 任务 ---------- */
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:none}
.chk{width:17px;height:17px;border:1.6px solid #cfd8e2;border-radius:5px;flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:.15s}
.chk:hover{border-color:var(--pri)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.task-b{flex:1;min-width:0}
.task-t{font-size:13.5px}
.task.done .task-t{color:var(--txt3);text-decoration:line-through}
.task-m{font-size:11.5px;color:var(--txt3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task-a{display:flex;gap:6px;opacity:0;transition:.15s}
.task:hover .task-a{opacity:1}
@media(max-width:680px){.task-a{opacity:1}}
.overdue{color:var(--danger)}

/* ---------- 进度 ---------- */
.sub-card{border:1px solid var(--line);border-radius:12px;padding:13px}
.sub-top{display:flex;align-items:center;margin-bottom:8px}
.sub-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-pct{margin-left:auto;font-size:13px;font-weight:700}
.sub-line{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt3);margin-top:7px}

/* ---------- 列表表格 ---------- */
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-weight:500;color:var(--txt3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tr:last-child td{border-bottom:none}
.tb tr:hover td{background:#fafbfc}
.tb .act{text-align:right;white-space:nowrap}
.tb-wrap{overflow-x:auto}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}

/* ---------- 图表 ---------- */
.chart{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart .b{width:100%;max-width:30px;background:var(--pri-soft);border-radius:5px 5px 0 0;min-height:3px;transition:height .4s;position:relative}
.chart .b.today{background:var(--pri)}
.chart .l{font-size:10.5px;color:var(--txt3)}
.mini-line{width:100%;height:120px}

/* ---------- 指标 ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .k{font-size:11.5px;color:var(--txt3)}
.kpi .v{font-size:22px;font-weight:700;line-height:1.3}
.kpi .v small{font-size:12px;font-weight:500;color:var(--txt2)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:13px;outline:none}
.filters select:focus,.filters input:focus{border-color:var(--pri)}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(25,35,45,.42);display:none;align-items:flex-start;justify-content:center;padding:36px 14px;overflow:auto;z-index:60}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(20,30,40,.18);overflow:hidden}
.modal.wide{max-width:860px}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h h3{font-size:15px;font-weight:600}
.modal-h .x{margin-left:auto;color:var(--txt3);font-size:20px;line-height:1}
.modal-b{padding:16px 18px;max-height:66vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fbfcfd}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--txt2)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;background:#fff;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri)}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--txt3);background:#f7f9fb;border-radius:8px;padding:9px 11px;margin-bottom:12px}
/* ---------- 番茄钟结束弹窗 ---------- */
.palert{position:fixed;inset:0;background:rgba(25,35,45,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:80;backdrop-filter:blur(3px)}
.palert.on{display:flex;animation:pfade .22s ease}
@keyframes pfade{from{opacity:0}to{opacity:1}}
.palert-box{background:#fff;border-radius:18px;padding:28px 26px 20px;width:100%;max-width:340px;text-align:center;box-shadow:0 24px 60px rgba(20,30,40,.28);animation:ppop .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes ppop{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.palert-ic{font-size:40px;line-height:1;margin-bottom:10px}
.palert-t{font-size:19px;font-weight:700;margin-bottom:6px}
.palert-s{font-size:13px;color:var(--txt2);margin-bottom:12px}
.palert-cd{font-size:12px;color:var(--txt3);margin-bottom:14px;min-height:16px}
.palert-btns{display:flex;gap:8px;justify-content:center}
.palert-btns .btn{min-width:110px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#25313d;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="logo">考研<span>备考工作台</span></div>
    <div class="spacer"></div>
    <button class="tb-btn" onclick="openSettings()">设置</button>
    <button class="tb-btn" id="exportBtn" onclick="exportData()" title="数据只存在本机浏览器，建议每周导出一次">导出</button>
    <button class="tb-btn" onclick="document.getElementById('importFile').click()">导入</button>
    <button class="tb-btn" onclick="exportExcel()">导出Excel</button>
    <button class="tb-btn" id="syncBtn" onclick="openSync()">☁ 同步</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">
  </div>
  <div class="nav" id="nav"></div>
</div>

<div class="wrap">
  <div id="backupBar" style="padding-top:14px"></div>
  <div id="syncBar"></div>
  <section class="page on" id="page-home"></section>
  <section class="page" id="page-plan"></section>
  <section class="page" id="page-subject"></section>
  <section class="page" id="page-paper"></section>
  <section class="page" id="page-mistake"></section>
  <section class="page" id="page-mock"></section>
  <section class="page" id="page-res"></section>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="palert" id="palert">
  <div class="palert-box">
    <div class="palert-ic" id="palertIc">🎉</div>
    <div class="palert-t" id="palertT">专注完成</div>
    <div class="palert-s" id="palertS">休息一下，起来活动活动</div>
    <div class="palert-cd" id="palertCd"></div>
    <div class="palert-btns">
      <button class="btn" id="palertMain" onclick="palertMain()">开始休息</button>
      <button class="btn ghost" onclick="palertSkip()">跳过</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 数据 ===================== */
const KEY = 'kaoyan_workbench_v1';
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function defaultState(){
  return {
    meta:{ examDate:'2026-12-19', school:'', major:'', motto:'', targetTotal:0 },
    subjects:[
      {id:uid(), name:'英语',     color:'#3d7f9a', target:70,  chapters:[{id:uid(),name:'词汇',done:false},{id:uid(),name:'长难句',done:false},{id:uid(),name:'阅读',done:false},{id:uid(),name:'写作',done:false}]},
      {id:uid(), name:'政治',     color:'#c0705a', target:70,  chapters:[{id:uid(),name:'马原',done:false},{id:uid(),name:'毛中特',done:false},{id:uid(),name:'史纲',done:false},{id:uid(),name:'思修',done:false}]},
      {id:uid(), name:'中医综合', color:'#4d9d7c', target:240, chapters:[{id:uid(),name:'中医基础理论',done:false},{id:uid(),name:'中医诊断学',done:false},{id:uid(),name:'中药学',done:false},{id:uid(),name:'方剂学',done:false},{id:uid(),name:'中医内科学',done:false},{id:uid(),name:'针灸学',done:false}]},
      {id:uid(), name:'自定义科目', color:'#8a7fc0', target:0, chapters:[]}
    ],
    plans:[], papers:[], mistakes:[], mocks:[], resources:[], templates:[],
    sessions:[],
    settings:{ focusMin:55, restMin:5, sound:true, notify:false, lastSubject:'', warnNoSubject:true, lastExport:'', backupCount:0 }
  };
}
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const d = JSON.parse(raw);
    const base = defaultState();
    const s = Object.assign(base, d, {settings:Object.assign(base.settings, d.settings||{})});
    return migrate(s);
  }catch(e){ return defaultState(); }
}
/* 旧数据迁移：把独立的 tasks 合并进 plans（学习计划） */
function migrate(s){
  s.plans = s.plans || [];
  if(s.tasks && s.tasks.length){
    s.tasks.forEach(t=>{
      s.plans.push({
        id: t.id||uid(), date: t.date||todayStr(), subject: t.subject||'',
        content: t.title||'', hours: '', priority: t.priority||'中',
        status: t.status==='已完成'?'已完成':'待完成',
        deadline: t.deadline||'', note: t.note||''
      });
    });
    delete s.tasks;
  }
  s.plans.forEach(p=>{ if(!p.priority) p.priority='中'; if(!p.status) p.status='待完成'; });
  s.templates = s.templates || [];
  s.settings.popup = s.settings.popup !== false;
  s.settings.autoRest = s.settings.autoRest !== false;
  return s;
}
let autoSyncTimer = null, syncing = false;
function save(){
  localStorage.setItem(KEY, JSON.stringify(S));
  // 自动上传：改动后延迟同步；同步过程中的保存不再排程，避免自己触发自己
  if(!syncing && S.settings && S.settings.autoSync && S.settings.syncCode){
    clearTimeout(autoSyncTimer);
    autoSyncTimer = setTimeout(()=>{ syncPush(true); }, 2500);
  }
}

/* ===================== 工具 ===================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function weekStart(d=new Date()){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
const fmtDate = s => s ? new Date(s).toLocaleDateString('sv-SE') : '';
function weekDates(){ const ws=weekStart(); return Array.from({length:7},(_,i)=>{const d=new Date(ws); d.setDate(ws.getDate()+i); return d.toLocaleDateString('sv-SE');}); }
function subjectOf(id){ return S.subjects.find(s=>s.id===id) || {name:'未分类',color:'#9aa4b0'}; }
const PRI = {'高':'p1','中':'p2','低':'p3'};
function subjectProgress(sub){
  if(!sub.chapters || !sub.chapters.length) return 0;
  return Math.round(sub.chapters.filter(c=>c.done).length / sub.chapters.length * 100);
}
function todayMinutes(){
  const t = todayStr();
  return S.sessions.filter(s=>s.date===t).reduce((a,b)=>a+b.minutes,0);
}
function todayPomos(){ const t=todayStr(); return S.sessions.filter(s=>s.date===t && s.type==='pomodoro').length; }

/* ---------- 按科目统计学习时长 ---------- */
function minutesIn(dates, sid){
  return S.sessions.filter(s=>{
    if(sid && s.subject!==sid) return false;
    return !dates || dates.indexOf(s.date)>=0;
  }).reduce((a,b)=>a+(+b.minutes||0),0);
}
function subjectMinutes(sid, range){
  if(range==='today') return minutesIn([todayStr()], sid);
  if(range==='week')  return minutesIn(weekDates(), sid);
  return minutesIn(null, sid);            // 全部
}
const fmtH = m => m>=60 ? (m/60).toFixed(1)+'h' : m+'m';
function subjectPomos(sid, range){
  const dates = range==='today'?[todayStr()] : (range==='week'?weekDates():null);
  return S.sessions.filter(s=>s.type==='pomodoro' && s.subject===sid && (!dates||dates.indexOf(s.date)>=0)).length;
}
/* 各科今日时长占比，用于首页展示 */
function todayBySubject(){
  return S.subjects.map(s=>({
    id:s.id, name:s.name, color:s.color,
    min: subjectMinutes(s.id,'today'),
    week: subjectMinutes(s.id,'week'),
    all: subjectMinutes(s.id,'all'),
    pomos: subjectPomos(s.id,'today')
  }));
}

/* ===================== 弹窗表单 ===================== */
let modalSubmit = null;
function openModal({title, fields, values={}, submitText='保存', onSubmit, extra=''}){
  const f = fields.map(fd=>{
    const v = values[fd.key]!=null ? values[fd.key] : (fd.def!=null?fd.def:'');
    let input;
    if(fd.type==='select'){
      input = `<select data-k="${fd.key}">${fd.options.map(o=>{const val=typeof o==='object'?o.value:o; const lab=typeof o==='object'?o.label:o; return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    }else if(fd.type==='textarea'){

    }

/* ===================== 番茄钟 ===================== */
const T = { mode:'focus', remain:S.settings.focusMin*60, running:false, tick:null, subject:S.settings.lastSubject||'', endAt:0 };
function pomoReset(mode){
  T.mode = mode || T.mode;
  T.running = false; clearInterval(T.tick);
  T.remain = (T.mode==='focus'? S.settings.focusMin : S.settings.restMin) * 60;
  renderPomo();
}
function pomoStart(){
  if(T.running) return;
  if(T.remain<=0) pomoReset(T.mode);
  if(T.mode==='focus' && !T.subject && S.settings.warnNoSubject!==false){
    toast('未选科目，本轮时长会记到「未分类」，可在右边切换');
  }
  T.running = true;
  T.endAt = Date.now() + T.remain*1000;
  clearInterval(T.tick);
  T.tick = setInterval(()=>{
    T.remain = Math.max(0, Math.round((T.endAt - Date.now())/1000));
    if(T.remain<=0){ pomoFinish(); return; }
    tickPomo();
  },500);
  renderPomo();
}
function pomoPause(){ T.running=false; clearInterval(T.tick); T.remain = Math.max(0, Math.round((T.endAt - Date.now())/1000)); renderPomo(); }
function pomoSkip(){ const next = T.mode==='focus'?'rest':'focus'; pomoReset(next); }
function pomoFinish(){
  clearInterval(T.tick); T.running=false;
  const wasFocus = T.mode==='focus';
  if(wasFocus){
    S.sessions.push({id:uid(), date:todayStr(), minutes:S.settings.focusMin, subject:T.subject, type:'pomodoro', at:Date.now()});
    save();
    beep(); notify('专注结束','休息 '+S.settings.restMin+' 分钟，起来活动一下');
    pomoReset('rest');
    if(S.settings.autoRest!==false){ pomoStart(); }
    showPomoAlert('focus');
  }else{
    beep(); notify('休息结束','回到座位，继续下一轮专注');
    pomoReset('focus');
    showPomoAlert('rest');
  }
  renderAll();
}

    : '休息好了。回到座位，继续下一轮 '+S.settings.focusMin+' 分钟专注';

function blinkTitle(txt){
  clearInterval(titleTimer);

function beep(){
  if(!S.settings.sound) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach(t=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
      o.frequency.value= t? 660:880; g.gain.setValueAtTime(.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2); });
  }catch(e){}
}

  if(!S.settings.notify) return;

function tickPomo(){
  const t=$('#pomoTime'), r=$('#pomoRing'), m=$('#pomoMode'), b=$('#pomoMain');
  if(!t){ renderPomo(); return; }
  const color = T.mode==='focus' ? '#3d7f9a' : '#4d9d7c';
  t.textContent = fmtTime(T.remain); t.style.color = color;
  if(m) m.textContent = (T.mode==='focus'?'专注中':'休息中')+' · '+(T.mode==='focus'?S.settings.focusMin:S.settings.restMin)+'分钟';
  if(b) b.textContent = T.running?'暂停':'开始专注';

  if(st && T.subject){ const n=subjectOf(T.subject).name; if(n) st.textContent = n+' 今日已学 '+fmtH(subjectMinutes(T.subject,'today')); }
  if(r){
    const total = (T.mode==='focus'?S.settings.focusMin:S.settings.restMin)*60;
    const pct = total ? (total-T.remain)/total : 0;
    r.setAttribute('stroke-dashoffset',(RING*(1-pct)).toFixed(1));

  }

/* 今日任务 = 学习计划中日期为今天 + 之前未完成（逾期）的条目 */
function todayPlanSet(){
  const t = todayStr();
  const all = S.plans;
  const doneToday = all.filter(p=>p.status==='已完成' && p.date===t).length;
  const today = all.filter(p=>p.date===t && p.status!=='已完成');
  const overdue = all.filter(p=>p.status!=='已完成' && p.date && p.date < t);
  overdue.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return {doneToday, today, overdue};
}

function renderTaskList(list, showEmpty){
  if(!list.length) return `<div class="empty">${showEmpty?'今天还没有任务，用「⚡ 一键生成」把计划批量倒进来':'暂无任务'}</div>`;
  return list.map(t=>{
    const s = subjectOf(t.subject);
    const od = t.status!=='已完成' && t.date && t.date<todayStr();
    return `<div class="task ${t.status==='已完成'?'done':''}">
      <button class="chk ${t.status==='已完成'?'on':''}" onclick="togglePlan('${t.id}')"></button>
      <div class="task-b">
        <div class="task-t">${esc(t.content)}</div>
        <div class="task-m">
          <span class="dot" style="background:${s.color}"></span>${esc(s.name)}

          <span class="${od?'overdue':''}">${t.deadline?'⏰ '+esc(t.deadline):''}${od?' 逾期 '+esc(t.date):''}</span>
          ${t.hours?' · '+t.hours+'h':''}
          ${t.status==='进行中'?'<span class="tag pri">进行中</span>':''}

  }).join('');
}

function guessSubject(text){
  const t = text.toLowerCase();
  let best = null, bestLen = 0;
  SUBJ_KW.forEach(g=>{
    const sub = S.subjects.find(s=>s.name.indexOf(g.key)===0 || g.key.indexOf(s.name)===0);
    if(!sub) return;
    g.words.forEach(w=>{ if(t.indexOf(w)>=0 && w.length>bestLen){ bestLen = w.length; best = sub.id; } });
  });
  return best || '';
}
function extractDeadline(str){
  const s = String(str);
  const dm = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/) || s.match(/(上午|中午|下午|晚上|早上|傍晚)?\s*(\d{1,2})\s*[点時时](半|\d{1,2}分?)?/);
  if(!dm) return '';
  let h, mm = 0;
  if(/^\d{1,2}\s*[:：]/.test(dm[0])){
    h = parseInt(dm[1],10); mm = parseInt(dm[2],10);
  }else{
    h = parseInt(/上午|中午|下午|晚上|早上|傍晚/.test(dm[1]||'') ? dm[2] : dm[1],10);
    if(/下午|晚上|傍晚/.test(s) && h<12) h += 12;
    if(/半/.test(dm[0])) mm = 30;
    else if(dm[3] && /^\d+/.test(dm[3])) mm = parseInt(dm[3],10);
  }
  if(!(h>=0 && h<=24)) return '';
  return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
/* 纯时间 / 无实质内容的碎片（如「晚上9点前完成」），不该变成任务 */
const TIME_JUNK = /^(?:在|于|尽量|争取|最好)?\s*(?:今天|今日|明天|明日|今晚|明晚|上午|中午|下午|晚上|早上|傍晚)?\s*\d{1,2}\s*(?:[:：]\d{2})?\s*[点時时]?(?:\d{1,2}分|半)?\s*(?:之?前|以前|左右|截止|之前)?\s*(?:完成|做完|交|结束|截止|搞定|前)?[。.．,，]?$/;
const MOD_KW = ['务必','必须','重点','重要','一定','优先','关键','有空','选做','随意','顺便','如果','掌握','记牢','背熟','搞懂','完成','搞定','做完','背诵','复习','再','然后','接着'];
function isJunk(s){
  const t = s.trim();
  if(!t) return true;
  if(TIME_JUNK.test(t)) return true;
  let core = t.replace(/\d+(\.\d+)?\s*(小时|时|h|H|分钟|篇|章|节|套|题|道|个|页|遍|组|单元)/g,'')
              .replace(/[0-9\s，,。、；;：:点時时前完成截止之前在做]|\d{1,2}:\d{2}/g,'');
  MOD_KW.forEach(k=>{ core = core.split(k).join(''); });
  return core.replace(/[，,。、；;\s]/g,'').length < 2;
}
function parseOneLine(raw, opts){
  let s = String(raw).trim()
    .replace(/^[\s\-–—•·*●○]+/,'')
    .replace(/^[（(]?\d+[)）.、．]\s*/,'')
    .replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/,'')
    .trim();
  if(!s || s.length<2) return [];
  s = s.replace(/[，,。;；！!？?]$/,'').trim();
  if(!s) return [];
  if(isJunk(s)) return [];

  // 截止时间：本句没有就用整行的
  let deadline = extractDeadline(s) || (opts.baseDeadline || '');
  // 时长
  let hours = '';
  const hm = s.match(/(\d+(?:\.\d+)?)\s*(?:个)?\s*(小时|时|h|H)/) || s.match(/(\d+)\s*分钟/);
  if(hm) hours = /分钟/.test(hm[0]) ? (Math.round(parseInt(hm[1],10)/6)/10).toFixed(1) : hm[1];
  // 数量
  const qm = s.match(/(\d+)\s*(篇|章|节|套|题|道|个|页|遍|组|单元|单元题)/);
  const count = qm ? Math.min(20, parseInt(qm[1],10)) : 0;
  const unit = qm ? qm[2] : '';
  // 优先级
  let priority = opts.basePriority || opts.defPriority || '中';
  if(HIGH_KW.some(k=>s.indexOf(k)>=0)) priority = '高';
  else if(LOW_KW.some(k=>s.indexOf(k)>=0)) priority = '低';
  // 科目
  const subject = opts.autoSubject ? guessSubject(s) : '';

  let title = s;
  let prev;
  do{ prev = title; title = title.replace(FILLER,'').trim(); }while(title!==prev && title.length>2);
  title = (title||s).replace(/^[，,、]\s*/,'').trim() || s;

  if(opts.expand && count>1 && /篇|章|节|套|遍|组|单元/.test(unit)){
    const per = hours ? (Math.max(0.1, +(hours)/count)).toFixed(1) : '';
    return Array.from({length:count},(_,i)=>({
      content:`${title}（第 ${i+1} ${unit}）`, subject, priority, deadline, hours:per, status:'待完成'
    }));
  }
  return [{content:title, subject, priority, deadline, hours, status:'待完成'}];
}
function parseTaskText(text, opts){
  const lines = text.split(/\r?\n/);
  const out = [];
  lines.forEach(line=>{
    let parts = [line];
    if(!/^[\s\-–—•·*●○]?[（(]?\d+[)）.、．]/.test(line.trim()) && line.length>0){
      parts = line.split(/[。;；\n]/);
    }
    parts.forEach(p=>{
      const seg = String(p).length>18 ? String(p).split(/(?<=[，,、])/) : [p];
      const baseDeadline = extractDeadline(String(p));
      const bp = HIGH_KW.some(k=>String(p).indexOf(k)>=0) ? '高' : (LOW_KW.some(k=>String(p).indexOf(k)>=0) ? '低' : null);
      seg.forEach(x=>{ parseOneLine(x, Object.assign({},opts,{baseDeadline, basePriority:bp})).forEach(r=>out.push(r)); });
    });
  });
  const seen = new Set();
  return out.filter(r=>{ const k=r.content; if(seen.has(k)) return false; seen.add(k); return r.content.length>1; });
}

function copyDay(){

        ${S.subjects.map(s=>`<td>${m.scores&&m.scores[s.id]!=null?m.scores[s.id]:'—'}</td>`).join('')}
        <td><b>${esc(m.total||0)}</b></td><td class="muted tiny">${esc(m.note||'')}</td>
        <td class="act"><button class="link-btn" onclick="editMock('${m.id}')">编辑</button>

    </div>

function drawLine(list){
  if(list.length<2) return list.length? '' : '<div class="empty" style="margin-bottom:14px">记录 2 次以上模考后，这里会显示总分趋势</div>';
  const w=620,h=130,pad=14;
  const vals = list.map(m=>+m.total||0);
  const max = Math.max(...vals), min = Math.min(...vals);
  const span = (max-min)||1;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w-pad*2)/(vals.length-1);
    const y = h-pad - (v-min)/span*(h-pad*2);
    return [x,y];
  });
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<div class="tiny muted" style="margin-bottom:2px">总分趋势</div>
  <svg class="mini-line" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:140px">
    <path d="${d} L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z" fill="#e8f2f6"/>
    <path d="${d}" fill="none" stroke="#3d7f9a" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="#3d7f9a" stroke-width="2"/>`).join('')}
    ${pts.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${h-2}" font-size="10" fill="#9aa4b0" text-anchor="middle">${esc((list[i].name||'').slice(0,6))}</text>`).join('')}
    ${pts.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" font-size="10" fill="#6b7684" text-anchor="middle">${vals[i]}</text>`).join('')}
  </svg>`;
}

/* ===================== 多设备同步（同步码） ===================== */
const SYNC_API = 'https://jsonblob.com/api/jsonBlob';
const SYNC_TAG = 'kaoyan_workbench';
const SYNC_VER = 1;
function syncPayload(){
  return { __app:SYNC_TAG, __ver:SYNC_VER, __ts:Date.now(), data:S };
}
function syncState(){
  return { code: S.settings.syncCode||'', ts: S.settings.syncTs||0 };
}
function fmtSyncTime(ts){
  if(!ts) return '从未同步';
  const d = new Date(ts);
  const diff = Math.round((Date.now()-ts)/1000);
  if(diff<60) return '刚刚';
  if(diff<3600) return diff/60<1?'1 分钟前':Math.round(diff/60)+' 分钟前';
  if(diff<86400) return Math.round(diff/3600)+' 小时前';
  return d.toLocaleDateString('sv-SE')+' '+d.toTimeString().slice(0,5);
}
async function syncFetch(url, opt){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 20000);
  try{
    const r = await fetch(url, Object.assign({signal:ctl.signal}, opt));
    return r;
  } finally { clearTimeout(timer); }
}
/* 生成新同步码：在云端开一个空档案，拿到 id 当同步码 */
async function syncCreate(){
  setSyncMsg('正在生成同步码…', '');
  try{
    const r = await syncFetch(SYNC_API, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({__app:SYNC_TAG,__ver:SYNC_VER,__ts:Date.now(),data:null})
    });
    if(!r.ok && r.status!==201) throw new Error('服务返回 HTTP '+r.status);
    let id = (r.headers.get('x-jsonblob')||'').trim();
    if(!id){
      const loc = (r.headers.get('location')||'').trim();
      id = loc.split('/').pop();
    }
    if(!id || id.length<6) throw new Error('未能取得同步码');
    S.settings.syncCode = id;
    S.settings.autoSync = true;   // 生成即开启自动同步
    save();
    setSyncMsg('同步码已生成：'+id+'（已开启自动同步）', 'ok');
    renderSyncBody(); renderSyncBar();
  }catch(e){
    setSyncMsg('生成失败：'+e.message+'（检查网络，或改用导出 JSON 手动搬家）', 'err');
  }
}
function syncUseCode(){
  const v = ($('#syncCodeInput')||{}).value || '';
  const id = v.trim();
  if(id.length<6) return setSyncMsg('同步码看起来不完整', 'err');
  S.settings.syncCode = id;
  S.settings.autoSync = true;
  save();
  setSyncMsg('已绑定同步码（已开启自动同步），点「从云端拉取」试试', 'ok');
  renderSyncBody(); renderSyncBar();
}
/* 上传：本机 → 云端 */
async function syncPush(silent){
  const id = syncState().code;
  if(!id) return setSyncMsg('还没有同步码，先生成一个', 'err');
  if(syncing) return;
  const body = JSON.stringify(syncPayload());
  if(body.length > 800000) return setSyncMsg('数据太大（'+Math.round(body.length/1024)+'KB），请先精简', 'err');
  if(!silent) setSyncMsg('正在上传…', '');
  syncing = true;
  try{
    // 安全模式：先看云端是不是比本机上次同步的时间更新
    if(S.settings.safeSync!==false){
      const g = await syncFetch(SYNC_API+'/'+encodeURIComponent(id), {headers:{'Accept':'application/json'}});
      if(g.ok){
        const j = await g.json().catch(()=>null);
        const cts = j && j.__ts ? j.__ts : 0;
        if(cts && S.settings.syncTs && cts > S.settings.syncTs + 3000){
          const t = fmtSyncTime(cts);
          setSyncMsg('云端有更新的数据（'+t+'），已停止上传。请先点「从云端拉取」，确认后再上传。', 'err');
          return false;
        }
      }
    }
    const r = await syncFetch(SYNC_API+'/'+encodeURIComponent(id), {
      method:'PUT',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body
    });
    if(!r.ok) throw new Error('上传失败 HTTP '+r.status);
    S.settings.syncTs = Date.now();
    S.settings.lastExport = todayStr();
    syncing = true; try{ save(); } finally { syncing = false; }
    renderBackupBar(); renderSyncBar();
    setSyncMsg('已上传 '+Math.round(body.length/1024)+'KB · '+fmtSyncTime(S.settings.syncTs), 'ok');
    if(silent) toast('已自动同步到云端');
    renderSyncBody();
    return true;
  }catch(e){
    setSyncMsg('上传失败：'+e.message, 'err');
    return false;
  }finally{
    syncing = false;
  }
}
/* 拉取：云端 → 本机（先备份本机，可撤销） */
async function syncPull(){
  const id = syncState().code;
  if(!id) return setSyncMsg('还没有同步码', 'err');
  if(!confirm('将用云端数据覆盖本机的全部记录（科目、计划、时长、真题、错题、模考、资料）。\n本机当前数据会先存一份快照，可撤销。\n\n确定继续吗？')) return;
  setSyncMsg('正在拉取…', '');
  try{
    const r = await syncFetch(SYNC_API+'/'+encodeURIComponent(id), {headers:{'Accept':'application/json'}});
    if(r.status===404) throw new Error('云端没有这个同步码的数据');
    if(!r.ok) throw new Error('拉取失败 HTTP '+r.status);
    const j = await r.json();
    if(!j || !j.data) throw new Error('云端数据为空或格式不对');
    if(j.__app && j.__app!==SYNC_TAG) throw new Error('这个同步码存的不是本应用的数据');
    // 备份本机
    localStorage.setItem(KEY+'_before_sync', JSON.stringify({ts:Date.now(), state:S}));
    const code = S.settings.syncCode;
    const base = defaultState();
    let ns = Object.assign(base, j.data, {settings:Object.assign(base.settings, (j.data&&j.data.settings)||{})});
    ns = migrate(ns);
    ns.settings.syncCode = code;
    ns.settings.syncTs = j.__ts || Date.now();
    S = ns;
    syncing = true;
    try{ save(); } finally { syncing = false; }
    renderAll(); renderSyncBody(); renderBackupBar(); renderSyncBar();
    const n = (S.plans||[]).length + (S.sessions||[]).length;
    setSyncMsg('已拉取云端数据（'+fmtSyncTime(j.__ts)+'），共 '+n+' 条计划/时长记录', 'ok');
    toast('已从云端恢复');
  }catch(e){
    setSyncMsg('拉取失败：'+e.message, 'err');
  }
}
function syncUndo(){
  try{
    const raw = localStorage.getItem(KEY+'_before_sync');
    if(!raw) return setSyncMsg('没有可撤销的同步记录', 'err');
    const o = JSON.parse(raw);
    if(!confirm('把数据恢复到上次拉取前的状态？')) return;
    const base = defaultState();
    S = migrate(Object.assign(base, o.state, {settings:Object.assign(base.settings,(o.state&&o.state.settings)||{})}));
    save(); renderAll(); renderSyncBody();
    setSyncMsg('已撤销，恢复到拉取前', 'ok');
  }catch(e){ setSyncMsg('撤销失败：'+e.message, 'err'); }
}
function syncClear(){
  if(!confirm('解除本机的同步码绑定？云端数据不会被删除，只是这台设备不再同步。')) return;
  S.settings.syncCode = ''; S.settings.syncTs = 0; S.settings.autoSync = false;
  save(); renderSyncBody(); renderSyncBar(); setSyncMsg('已解除绑定', 'ok');
}

/* ===================== 导出 Excel（纯前端生成 xlsx） ===================== */
const CRC_T = (function(){
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
const utf8 = s => new TextEncoder().encode(s);
function xEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function colName(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }
function zipStore(files){
  const chunks=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name = utf8(f.name), data = f.data, crc = crc32(data);
    const lh = new Uint8Array(30+name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true); dv.setUint16(28,0,true);
    lh.set(name,30);
    chunks.push(lh,data);
    const ch = new Uint8Array(46+name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    ch.set(name,46); central.push(ch);
    offset += lh.length + data.length;
  });
  const cdSize = central.reduce((a,b)=>a+b.length,0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true); ev.setUint16(20,0,true);
  return new Blob([...chunks, ...central, eo], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function sheetXml(rows, widths){
  const body = rows.map((r,ri)=>{
    const cells = r.map((c,ci)=>{
      const ref = colName(ci+1)+(ri+1);
      if(c===null||c===undefined||c==='') return `<c r="${ref}"${ri===0?' s="1"':''}/>`;
      const st = ri===0 ? ' s="1"' : '';
      if(typeof c==='number' && isFinite(c)) return `<c r="${ref}"${st}><v>${c}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xEsc(c)}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}">${cells}</row>`;
  }).join('');
  const cols = widths && widths.length
    ? `<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
  return utf8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`);
}
function safeSheetName(n,i){
  const s = String(n).replace(/[\\\/\?\*\[\]:]/g,'·').slice(0,31) || ('Sheet'+i);
  return s;
}
function buildXlsx(sheets){
  const files = [];
  const ct = [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`];
  sheets.forEach((s,i)=>ct.push(`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`));
  ct.push('</Types>');
  files.push({name:'[Content_Types].xml', data:utf8(ct.join(''))});
  files.push({name:'_rels/.rels', data:utf8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)});
  files.push({name:'xl/workbook.xml', data:utf8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i)=>`<sheet name="${xEsc(safeSheetName(s.name,i+1))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`)});
  const rels = sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`);
  rels.push(`<Relationship Id="rId900" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`);
  files.push({name:'xl/_rels/workbook.xml.rels', data:utf8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`)});
  files.push({name:'xl/styles.xml', data:utf8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="等线"/></font><font><b/><sz val="11"/><name val="等线"/></font></fonts>
<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
<cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`)});
  sheets.forEach((s,i)=>{ files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:sheetXml(s.rows, s.widths)}); });
  return zipStore(files);
}
function excelSheets(){
  const sh = [];
  const wd = weekDates();
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const ts = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  const left = daysBetween(todayStr(), S.meta.examDate);
  const allMin = minutesIn(null,null);
  const wTasks = S.plans.filter(p=>p.date && wd.includes(p.date));
  const wRate = wTasks.length ? Math.round(S.plans.filter(p=>p.status==='已完成' && wd.includes(p.date)).length/wTasks.length*100) : 0;

  // 1 汇总
  sh.push({name:'汇总', widths:[22,26,18,18,18], rows:[
    ['考研备考工作台 · 数据汇总'],
    ['导出时间', ts],
    [],
    ['项目','内容','','',''],
    ['初试日期', S.meta.examDate||'未设置'],
    ['倒计时（天）', left>=0?left:0],
    ['目标院校', S.meta.school||'未设置'],
    ['目标专业', S.meta.major||'未设置'],
    ['目标总分', S.subjects.reduce((a,s)=>a+(+s.target||0),0)],
    ['累计学习（小时）', +(allMin/60).toFixed(1)],
    ['累计番茄（个）', S.sessions.filter(s=>s.type==='pomodoro').length],
    ['本周完成率（%）', wRate],
    [],
    ['科目','目标分','进度%','累计时长h','今日时长h'],
    ...S.subjects.map(s=>[s.name, s.target||0, subjectProgress(s),
      +(subjectMinutes(s.id,'all')/60).toFixed(1), +(subjectMinutes(s.id,'today')/60).toFixed(1)]),
    [],
    ['模块','记录条数','','',''],
    ['学习计划', S.plans.length],
    ['学习时长记录', S.sessions.length],
    ['真题', S.papers.length],
    ['错题薄弱点', S.mistakes.length],
    ['模考成绩', S.mocks.length],
    ['资料', S.resources.length],
    ['计划模板', (S.templates||[]).length]
  ]});

  // 2 学习时长
  const ss = S.sessions.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  sh.push({name:'学习时长', widths:[12,12,8,10,12,20,16], rows:[
    ['日期','科目','分钟','折合小时','来源','记录时间','备注'],
    ...ss.map(x=>[ x.date||'', subjectOf(x.subject).name, +x.minutes||0, +((+x.minutes||0)/60).toFixed(2),
      x.type==='pomodoro'?'番茄钟':'手动补录',
      x.at? new Date(x.at).toLocaleString('zh-CN',{hour12:false}) : '', x.note||'' ])
  ]});

  // 3 学习计划
  const pl = S.plans.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  sh.push({name:'学习计划', widths:[12,12,40,10,10,10,10,24], rows:[
    ['日期','科目','任务内容','优先级','截止时间','状态','预计h','备注'],
    ...pl.map(p=>[p.date||'', subjectOf(p.subject).name, p.content||'', p.priority||'中',
      p.deadline||'', p.status||'待完成', p.hours||'', p.note||''])
  ]});

  // 4 科目进度
  sh.push({name:'科目进度', widths:[14,10,10,10,12,12,12,10,40], rows:[
    ['科目','目标分','进度%','章节总数','已完成章节','今日时长h','本周时长h','今日番茄','累计时长h'],
    ...S.subjects.map(s=>[s.name, s.target||0, subjectProgress(s), s.chapters.length,
      s.chapters.filter(c=>c.done).length, +(subjectMinutes(s.id,'today')/60).toFixed(1),
      +(subjectMinutes(s.id,'week')/60).toFixed(1), subjectPomos(s.id,'today'),
      +(subjectMinutes(s.id,'all')/60).toFixed(1)])
  ]});

  // 5 章节明细
  const chRows = [];
  S.subjects.forEach(s=>s.chapters.forEach(c=>chRows.push([s.name, c.name, c.done?'已完成':'未完成'])));
  sh.push({name:'章节明细', widths:[14,36,10], rows:[['科目','章节','状态'], ...chRows]});

  // 6 真题
  const pp = S.papers.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  sh.push({name:'真题记录', widths:[26,12,12,8,8,10,10,36], rows:[
    ['试卷','科目','日期','得分','满分','正确率%','用时(分)','复盘要点'],
    ...pp.map(p=>[p.name||'', subjectOf(p.subject).name, p.date||'', +p.score||0, +p.total||0,
      p.total? Math.round((+p.score||0)/(+p.total)*100) : '', p.duration||'', p.note||''])
  ]});

  // 7 错题
  const ms = S.mistakes.slice();
  sh.push({name:'错题薄弱点', widths:[12,30,14,10,10,12,22,12,30], rows:[
    ['科目','知识点/题目','错误类型','状态','复习次数','下次复习','来源','记录日期','错因/思路'],
    ...ms.map(m=>[subjectOf(m.subject).name, m.point||'', m.type||'', m.status||'未掌握',
      +m.count||0, m.next||'', m.source||'', m.date||'', m.note||''])
  ]});

  // 8 模考
  const mk = S.mocks.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const mkHead = ['考试','日期', ...S.subjects.map(s=>s.name), '总分','备注'];
  const mkRows = mk.map(m=>[m.name||'', m.date||'', ...S.subjects.map(s=>(m.scores&&m.scores[s.id]!=null? m.scores[s.id] : '')),
    +m.total||0, m.note||'']);
  sh.push({name:'模考成绩', widths:[20,12, ...S.subjects.map(()=>10), 10, 26], rows:[mkHead, ...mkRows]});

  // 9 资料库
  sh.push({name:'资料库', widths:[30,10,14,18,10,34,26], rows:[
    ['资料名称','类型','科目','来源/作者','进度%','链接/路径','备注'],
    ...S.resources.map(r=>[r.name||'', r.type||'', subjectOf(r.subject).name, r.from||'',
      +r.progress||0, r.link||'', r.note||''])
  ]});
  return sh;
}
function exportExcel(){
  try{
    const blob = buildXlsx(excelSheets());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '考研备考工作台-'+todayStr()+'.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    toast('已导出 Excel（9 个工作表）');
  }catch(e){ console.error(e); toast('导出失败：'+e.message); }
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '考研备考工作台-备份-'+todayStr()+'.json';
  a.click();
  S.settings.lastExport = todayStr();
  S.settings.backupCount = (S.settings.backupCount||0)+1;
  save(); renderBackupBar();
  toast('已导出备份（第 '+(S.settings.backupCount)+' 次）');
}
function daysSinceExport(){
  if(!S.settings.lastExport) return null;
  return daysBetween(S.settings.lastExport, todayStr());
}
function renderBackupBar(){
  const el = $('#backupBar'); if(!el) return;
  const d = daysSinceExport();
  const btn = $('#exportBtn');
  if(btn) btn.className = 'tb-btn' + (d!=null && d>=7 ? ' warn' : '');
  const hasData = S.plans.length + S.sessions.length + S.mistakes.length + S.papers.length + S.mocks.length;
  if(hasData===0){ el.innerHTML=''; return; }
  if(d===null){
    el.innerHTML = `<div class="tip"><span>还没备份过。数据只存在这台设备的浏览器里，建议每周导出一次。</span>
      <button class="btn sm" onclick="exportData()">立即导出</button></div>`;
  }else if(d>=7){
    el.innerHTML = `<div class="tip"><span>距上次备份已 ${d} 天${d>=30?'（有点久了）':''}，建议导出一份存到网盘/微信收藏。</span>
      <button class="btn sm" onclick="exportData()">立即导出</button></div>`;
  }else{
    el.innerHTML = '';
  }
}
/* 关页面前，如果从没备份过且已有数据，提醒一次 */
window.addEventListener('beforeunload', e=>{
  const hasData = S.plans.length + S.sessions.length + S.mistakes.length + S.papers.length + S.mocks.length;
  if(hasData>0 && !S.settings.lastExport){
    e.preventDefault(); e.returnValue = '你还没导出过备份，数据可能因清理浏览器而丢失。确定离开吗？';
    return e.returnValue;
  }
});
function importData(input){
  const file = input.files[0]; if(!file) return;
  const fr = new FileReader();
  fr.onload = e=>{
    try{
      const d = JSON.parse(e.target.result);
      if(!d || typeof d!=='object') throw 0;
      const base = defaultState();
      S = Object.assign(base, d, {settings:Object.assign(base.settings, d.settings||{})});
      save(); renderAll(); toast('导入成功');
    }catch(err){ toast('导入失败：文件格式不正确'); }
    input.value = '';
  };
  fr.readAsText(file);
}

/* ===================== 导航 & 启动 ===================== */
const PAGES = [
  {id:'home', label:'首页', render:()=>renderHome()},
  {id:'plan', label:'学习计划', render:()=>renderPlan()},
  {id:'subject', label:'科目进度', render:()=>renderSubject()},
  {id:'paper', label:'真题管理', render:()=>renderPaper()},
  {id:'mistake', label:'错题薄弱点', render:()=>renderMistake()},
  {id:'mock', label:'模考成绩', render:()=>renderMock()},
  {id:'res', label:'资料库', render:()=>renderRes()}
];
let cur = 'home';
$('#nav').innerHTML = PAGES.map(p=>`<button data-p="${p.id}" onclick="go('${p.id}')">${p.label}</button>`).join('');
function go(id){
  cur = id;
  $$('.page').forEach(el=>el.classList.remove('on'));
  $('#page-'+id).classList.add('on');
  $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.p===id));
  const p = PAGES.find(x=>x.id===id); if(p) p.render();
  window.scrollTo({top:0});
}
function renderAll(){
  PAGES.forEach(p=>{ if(p.id===cur || p.id==='home') p.render(); });
  go(cur);
}
renderAll();
renderBackupBar();
renderSyncBar();
setInterval(()=>{ if(T.running) tickPomo(); }, 1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && T.running){ T.remain = Math.max(0, Math.round((T.endAt-Date.now())/1000)); tickPomo(); } });
(function restoreTimer(){
  try{
    const raw = localStorage.getItem(KEY+'_timer'); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && d.endAt > Date.now() + 2000){ T.mode = d.mode||'focus'; T.remain = Math.round((d.endAt-Date.now())/1000); pomoStart(); }
    else localStorage.removeItem(KEY+'_timer');
  }catch(e){}
})();
window.addEventListener('beforeunload', ()=>{ if(T.running) localStorage.setItem(KEY+'_timer', JSON.stringify({endAt:T.endAt, mode:T.mode})); else localStorage.removeItem(KEY+'_timer'); });

</script>
